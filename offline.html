<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Hors ligne — LaBible.app</title>
  <meta name="description" content="Vous êtes hors ligne. Les pages déjà consultées restent disponibles." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://labible.app/offline.html" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/styles.css?v=4" />
  <style>
    .stickyHeader { position: sticky; top: 0; z-index: 95; background: var(--bg, #0b0b0b); }
    .stickyHeader .topbar { position: relative !important; }
    .brandDot { color: var(--gold); font-weight: 700; }
    .pageContent { font-family: ui-serif, Georgia, "Times New Roman", serif; line-height: 1.75; }
    .pageContent h1 { font-size: 26px; margin: 6px 0 4px; letter-spacing:.2px; }
    .pageContent h2 { font-size: 19px; margin: 24px 0 8px; }
    .pageContent p, .pageContent li { color: var(--text); }
    .pageContent p { margin: 0 0 12px; }
    .pageContent a { color: var(--gold); text-decoration: underline; }
    .pageContent ul { margin: 0 0 14px; padding-left: 20px; }
    .pageContent li { margin: 0 0 7px; }
    .pageLead { color: var(--muted); font-size: 15px; margin: 0 0 18px; }
    .backLink { display:inline-block; font-size: 13px; margin-bottom: 6px; text-decoration:none; }
    .topActions .chip { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
  </style>
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FDT2GP8C8F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FDT2GP8C8F');
  </script>
  <script>
    (function(){ try { var t = localStorage.getItem('labible:theme') === 'light' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); } catch(e){} })();
  </script>
  <script src="/footer.js" defer></script>
</head>
<body>

  <div class="stickyHeader">
    <header class="topbar">
      <a class="brand" href="/" title="Accueil">
        <img src="/icons/icon-512x512.png" class="brandIcon" width="40" height="40" alt="LaBible.app" style="border-radius:8px;object-fit:cover;width:40px;height:40px;min-width:40px;max-width:40px;" />
        <div class="brandText">
          <div class="brandTitle">LaBible<span class="brandDot">.app</span></div>
          <div class="brandSub">LSG 1910</div>
        </div>
      </a>
      <div class="topActions">
        <a class="chip" href="/" title="Lecture">📖 Lire</a>
        <button id="btnTheme" class="iconBtn" title="Thème">🌙</button>
      </div>
    </header>
  </div>

  <main class="container">
    <article class="card pageContent">
      <a class="backLink muted" href="/">← Retour à la lecture</a>
      <h1>Vous êtes hors ligne</h1>
      <p class="pageLead">Pas de connexion pour le moment.</p>
      <p>Les chapitres et pages que vous avez déjà consultés restent disponibles hors ligne. Pour le reste, reconnectez-vous à Internet.</p>
      <p><button class="btnPrimary" onclick="location.reload()">↻ Réessayer</button></p>
      <p><a href="/">Retour à la lecture →</a></p>
    </article>

<!-- ── FOOTER STANDARD — identique sur toutes les pages ── -->
    <div id="lb-footer"></div>
  </main>

  <script>
    (function(){
      var y = document.getElementById('year'); if (y) y.textContent = new Date().getFullYear();
      var btn = document.getElementById('btnTheme');
      function sync(){ var t = document.documentElement.getAttribute('data-theme') || 'dark'; if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙'; }
      sync();
      if (btn) btn.addEventListener('click', function(){
        var cur = document.documentElement.getAttribute('data-theme') || 'dark';
        var nxt = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nxt);
        try { localStorage.setItem('labible:theme', nxt); } catch(e){}
        sync();
      });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function(){}); }); }
  </script>
</body>
</html>
