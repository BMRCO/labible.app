<script>
/* ============================
   LaBible.app PWA PRO
   + Chargement réel des données depuis /data
   - supporte plusieurs formats JSON
   - fallback sur plusieurs chemins & noms
============================ */

const $ = (id)=>document.getElementById(id);

const state = {
  tab: localStorage.getItem("tab") || "today",
  poetic: localStorage.getItem("poetic")==="1",
  lastRef: localStorage.getItem("lastRef") || "Genèse 1:1",
  favs: JSON.parse(localStorage.getItem("favs")||"[]"),
};

function save(){
  localStorage.setItem("tab", state.tab);
  localStorage.setItem("poetic", state.poetic ? "1":"0");
  localStorage.setItem("lastRef", state.lastRef);
  localStorage.setItem("favs", JSON.stringify(state.favs));
}

function toast(msg, actionText, actionFn){
  $("toastMsg").textContent = msg;
  if(actionText && actionFn){
    $("toastAction").style.display = "inline-flex";
    $("toastAction").textContent = actionText;
    $("toastAction").onclick = ()=>{ actionFn(); hideToast(); };
  }else{
    $("toastAction").style.display = "none";
    $("toastAction").onclick = null;
  }
  $("toast").classList.add("show");
}
function hideToast(){ $("toast").classList.remove("show"); }
$("toastClose").onclick = hideToast;

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

/* ============================
   1) Index livres (FR) + slugs fichiers
   -> tu podes ajustar 2-3 slugs se algum não bater com teu dataset
============================ */
const BOOKS = [
  ["Genèse","gen"],["Exode","exo"],["Lévitique","lev"],["Nombres","num"],["Deutéronome","deu"],
  ["Josué","jos"],["Juges","jdg"],["Ruth","rut"],["1 Samuel","1sa"],["2 Samuel","2sa"],
  ["1 Rois","1ki"],["2 Rois","2ki"],["1 Chroniques","1ch"],["2 Chroniques","2ch"],
  ["Esdras","ezr"],["Néhémie","neh"],["Esther","est"],["Job","job"],["Psaumes","psa"],
  ["Proverbes","pro"],["Ecclésiaste","ecc"],["Cantique des cantiques","sng"],
  ["Ésaïe","isa"],["Jérémie","jer"],["Lamentations","lam"],["Ézéchiel","ezk"],["Daniel","dan"],
  ["Osée","hos"],["Joël","jol"],["Amos","amo"],["Abdias","oba"],["Jonas","jon"],["Michée","mic"],
  ["Nahum","nam"],["Habacuc","hab"],["Sophonie","zep"],["Aggée","hag"],["Zacharie","zec"],["Malachie","mal"],
  ["Matthieu","mat"],["Marc","mrk"],["Luc","luk"],["Jean","jhn"],["Actes","act"],
  ["Romains","rom"],["1 Corinthiens","1co"],["2 Corinthiens","2co"],["Galates","gal"],["Éphésiens","eph"],
  ["Philippiens","php"],["Colossiens","col"],["1 Thessaloniciens","1th"],["2 Thessaloniciens","2th"],
  ["1 Timothée","1ti"],["2 Timothée","2ti"],["Tite","tit"],["Philémon","phm"],
  ["Hébreux","heb"],["Jacques","jas"],["1 Pierre","1pe"],["2 Pierre","2pe"],
  ["1 Jean","1jn"],["2 Jean","2jn"],["3 Jean","3jn"],["Jude","jud"],["Apocalypse","rev"],
];

// abreviações para pesquisa “Jn 3:16”
const BOOK_ALIASES = new Map([
  ["gen","Genèse"],["ge","Genèse"],["gn","Genèse"],
  ["exo","Exode"],["ex","Exode"],
  ["lev","Lévitique"],["lv","Lévitique"],
  ["nb","Nombres"],["nom","Nombres"],["nm","Nombres"],["num","Nombres"],["nombres","Nombres"],
  ["deu","Deutéronome"],["dt","Deutéronome"],
  ["ps","Psaumes"],["psa","Psaumes"],["psaumes","Psaumes"],
  ["pr","Proverbes"],["pro","Proverbes"],
  ["esa","Ésaïe"],["isa","Ésaïe"],
  ["jr","Jérémie"],["jer","Jérémie"],
  ["ez","Ézéchiel"],["ezk","Ézéchiel"],
  ["dn","Daniel"],["dan","Daniel"],
  ["mt","Matthieu"],["mat","Matthieu"],
  ["mc","Marc"],["mr","Marc"],["mrk","Marc"],
  ["lc","Luc"],["lk","Luc"],["luk","Luc"],
  ["jn","Jean"],["jhn","Jean"],["jean","Jean"],
  ["ac","Actes"],["act","Actes"],
  ["rm","Romains"],["rom","Romains"],
  ["1co","1 Corinthiens"],["2co","2 Corinthiens"],
  ["ga","Galates"],["gal","Galates"],
  ["ep","Éphésiens"],["eph","Éphésiens"],
  ["ph","Philippiens"],["php","Philippiens"],
  ["col","Colossiens"],
  ["1th","1 Thessaloniciens"],["2th","2 Thessaloniciens"],
  ["1ti","1 Timothée"],["2ti","2 Timothée"],
  ["tit","Tite"],["heb","Hébreux"],
  ["jc","Jacques"],["jas","Jacques"],
  ["1pe","1 Pierre"],["2pe","2 Pierre"],
  ["1jn","1 Jean"],["2jn","2 Jean"],["3jn","3 Jean"],
  ["jud","Jude"],["ap","Apocalypse"],["rev","Apocalypse"]
]);

/* ============================
   2) Loader dataset (/data)
   - cache em memória por livro
   - aceita formatos:
     A) { book, chapters: [ ["v1","v2"], ... ] }
     B) { chapters: { "1": { "1":"text" } } } etc
     C) [ { book, chapters: [...] }, ... ] (um único ficheiro)
============================ */

const Bible = {
  loaded: false,
  basePaths: ["./data/ls1910/", "./data/LSG1910/", "./data/"],
  // variações de filename para tentar
  filenameVariants(slug){
    const s = slug.toLowerCase();
    const variants = [
      `${s}.json`,
      `${s.toUpperCase()}.json`,
      `${s.replace(/\d/g,"")}.json`, // remove números p/ datasets estranhos
    ];
    // alguns datasets usam nomes longos
    const long = {
      gen:"genese", exo:"exode", lev:"levitique", num:"nombres", deu:"deuteronome",
      mat:"matthieu", mrk:"marc", luk:"luc", jhn:"jean", rev:"apocalypse"
    };
    if(long[s]) variants.unshift(`${long[s]}.json`);
    return [...new Set(variants)];
  },
  bookCache: new Map(), // key bookName => normalized {chapters: Array<Array<string>>}

  async init(){
    // tenta detectar um ficheiro “master”
    // (se não existir, carrega por livro quando precisar)
    const candidates = [
      ...this.basePaths.map(p=>`${p}bible_ls1910.json`),
      ...this.basePaths.map(p=>`${p}bible.json`),
      ...this.basePaths.map(p=>`${p}ls1910.json`),
      ...this.basePaths.map(p=>`${p}bible_lsg1910.json`),
    ];

    for(const url of candidates){
      const data = await safeFetchJson(url);
      if(!data) continue;

      // se for array de livros
      if(Array.isArray(data)){
        for(const item of data){
          const norm = normalizeBookData(item);
          if(norm?.book && norm?.chapters) this.bookCache.set(norm.book, norm);
        }
        if(this.bookCache.size){
          this.loaded = true;
          $("dataStatus").textContent = `Données: OK (${this.bookCache.size} livres)`;
          return true;
        }
      }

      // se for object com books
      if(data && typeof data==="object"){
        // algo tipo {books:[...]}
        const arr = data.books || data.Books || data.testaments || null;
        if(Array.isArray(arr)){
          // não tento adivinhar aqui; deixa on-demand
          break;
        }
      }
    }

    // on-demand
    this.loaded = true;
    $("dataStatus").textContent = "Données: OK (on-demand)";
    return true;
  },

  async getVerse(bookName, chapter, verse){
    const book = await this.getBook(bookName);
    if(!book) return null;
    const c = chapter-1;
    const v = verse-1;
    if(!book.chapters[c] || book.chapters[c][v]==null) return null;
    return book.chapters[c][v];
  },

  async getBook(bookName){
    if(this.bookCache.has(bookName)) return this.bookCache.get(bookName);

    // encontra slug
    const entry = BOOKS.find(([name])=>name===bookName);
    if(!entry) return null;
    const slug = entry[1];

    // tenta fetch em vários paths + variantes
    for(const base of this.basePaths){
      for(const fn of this.filenameVariants(slug)){
        const url = base + fn;
        const data = await safeFetchJson(url);
        if(!data) continue;

        // se for array global com livros
        if(Array.isArray(data)){
          // pode ser formato thiagobodruk: [ {abbrev, book, chapters:[...]} ...]
          const maybe = data.find(x=>{
            const bn = (x.book||x.name||"").toLowerCase();
            return bn.includes(bookName.toLowerCase()) || (x.abbrev||"").toLowerCase()===slug;
          });
          const norm = normalizeBookData(maybe);
          if(norm){ this.bookCache.set(bookName, norm); return norm; }
        } else {
          const norm = normalizeBookData(data, bookName);
          if(norm){ this.bookCache.set(bookName, norm); return norm; }
        }
      }
    }

    return null;
  }
};

async function safeFetchJson(url){
  try{
    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) return null;
    const ct = (r.headers.get("content-type")||"").toLowerCase();
    if(!ct.includes("application/json") && !url.toLowerCase().endsWith(".json")) return null;
    return await r.json();
  }catch(e){
    return null;
  }
}

function normalizeBookData(data, forcedBookName){
  if(!data || typeof data!=="object") return null;

  const bookName = forcedBookName || data.book || data.Book || data.name || data.title;
  if(!bookName) return null;

  // A) chapters: [ [v1,v2], [v1,...], ... ]
  if(Array.isArray(data.chapters)){
    if(Array.isArray(data.chapters[0])){
      return { book: bookName, chapters: data.chapters.map(ch=>ch.map(v=>String(v))) };
    }
    // B) chapters: [ {verse:1,text:""}, ... ] por capítulo (menos comum)
    if(data.chapters[0] && typeof data.chapters[0]==="object"){
      // tenta converter para [ [..] ]
      const chapters = [];
      for(const chObj of data.chapters){
        if(chObj && Array.isArray(chObj.verses)){
          const arr = [];
          for(const vv of chObj.verses){
            arr.push(String(vv.text ?? vv.Text ?? vv));
          }
          chapters.push(arr);
        }
      }
      if(chapters.length) return { book: bookName, chapters };
    }
  }

  // C) chapters em object: { "1": { "1":"text" } } ou { "1": ["v1","v2"] }
  if(data.chapters && typeof data.chapters==="object" && !Array.isArray(data.chapters)){
    const keys = Object.keys(data.chapters).sort((a,b)=>parseInt(a,10)-parseInt(b,10));
    const chapters = [];
    for(const k of keys){
      const ch = data.chapters[k];
      if(Array.isArray(ch)){
        chapters.push(ch.map(v=>String(v)));
      }else if(ch && typeof ch==="object"){
        const vkeys = Object.keys(ch).sort((a,b)=>parseInt(a,10)-parseInt(b,10));
        chapters.push(vkeys.map(vk=>String(ch[vk])));
      }
    }
    if(chapters.length) return { book: bookName, chapters };
  }

  // D) verses flat list (raríssimo) -> ignora
  return null;
}

/* ============================
   Lecture du jour (determinística)
   -> pega no dia do ano e escolhe um versículo “válido” por tentativa rápida
============================ */
async function verseOfDayRef(){
  // sequência de refs preferidas (rápidas)
  const pool = [
    "Psaumes 23:1","Jean 3:16","Romains 8:28","Proverbes 3:5","Ésaïe 41:10",
    "Philippiens 4:6","Matthieu 11:28","Psaumes 91:1","Psaumes 119:105","Hébreux 11:1"
  ];

  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const day = Math.floor((now-start) / (1000*60*60*24));
  // tenta alguns candidatos
  for(let i=0;i<pool.length;i++){
    const ref = pool[(day+i) % pool.length];
    const p = splitRef(parseRef(ref) || ref);
    const t = await Bible.getVerse(p.book, p.chapter, p.verse);
    if(t) return `${p.book} ${p.chapter}:${p.verse}`;
  }
  // fallback
  return state.lastRef;
}

/* ============================
   UI helpers
============================ */
function verseCard(ref, text){
  const isFav = state.favs.some(f=>f.ref===ref);
  return `
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div style="min-width:0">
        <div class="verseRef">${escapeHtml(ref)}</div>
        <div class="verseText ${state.poetic ? "poetic":""}">${escapeHtml(text)}</div>
      </div>
      <div class="row">
        <button class="btn ${isFav?"good":""}" id="btnFav">${isFav?"★":"☆"} Favori</button>
        <button class="btn primary" id="btnShare">📤 Partager</button>
      </div>
    </div>
  `;
}

function splitRef(ref){
  const m = ref.match(/^(.+?)\s+(\d+)\s*:\s*(\d+)$/);
  if(!m) return {book:"Genèse",chapter:1,verse:1};
  return {book:m[1],chapter:parseInt(m[2],10),verse:parseInt(m[3],10)};
}

function parseRef(q){
  if(!q) return null;
  const raw = q.trim().replace(/\s+/g," ");
  const m = raw.match(/^(.+?)\s+(\d+)\s*[:.]\s*(\d+)$/i);
  if(!m) return null;

  const bookIn = m[1].toLowerCase().trim();
  const c = parseInt(m[2],10);
  const v = parseInt(m[3],10);

  // tenta aliases
  const alias = BOOK_ALIASES.get(bookIn);
  if(alias) return `${alias} ${c}:${v}`;

  // tenta match por nome completo
  const found = BOOKS.find(([name])=>name.toLowerCase()===bookIn);
  if(found) return `${found[0]} ${c}:${v}`;

  // tenta match parcial (ex: "1 jean")
  const partial = BOOKS.find(([name])=>name.toLowerCase().replace(/é/g,"e").includes(bookIn.replace(/é/g,"e")));
  if(partial) return `${partial[0]} ${c}:${v}`;

  return null;
}

/* ============================
   Render
============================ */
function render(){
  save();
  ["tabToday","tabSearch","tabOpen","tabFav","tabSettings"].forEach(id=>$(id).classList.remove("primary"));
  const map = {today:"tabToday",search:"tabSearch",open:"tabOpen",fav:"tabFav",settings:"tabSettings"};
  $(map[state.tab]).classList.add("primary");

  if(state.tab==="today") renderToday();
  if(state.tab==="search") renderSearch();
  if(state.tab==="open") renderOpen();
  if(state.tab==="fav") renderFav();
  if(state.tab==="settings") renderSettings();
}

async function renderToday(){
  $("viewLeft").innerHTML = `<h2>Verset du jour</h2><p class="muted">Chargement…</p>`;
  $("viewRight").innerHTML = `
    <h3>Continuer</h3>
    <p class="muted">Reprendre là où vous étiez.</p>
    <button class="btn primary" id="btnContinue">▶️ Continuer</button>
    <div class="miniHelp">Dernier passage: <span class="kbd">${escapeHtml(state.lastRef)}</span></div>
  `;
  $("btnContinue").onclick = ()=>{ state.tab="open"; render(); };

  const ref = await verseOfDayRef();
  const p = splitRef(ref);
  const text = await Bible.getVerse(p.book, p.chapter, p.verse);

  if(!text){
    $("viewLeft").innerHTML = `
      <h2>Verset du jour</h2>
      <p class="muted">Impossible de charger les données du verset.</p>
      <div class="divider"></div>
      <p class="muted">Vérifie que tes fichiers JSON sont bien en <span class="kbd">/data</span> (ou <span class="kbd">/data/ls1910</span>).</p>
      <button class="btn primary" id="btnGoOpen">📖 Ouvrir</button>
    `;
    $("btnGoOpen").onclick = ()=>{ state.tab="open"; render(); };
    $("dataStatus").textContent = "Données: ERREUR";
    return;
  }

  $("viewLeft").innerHTML = `
    ${verseCard(ref, text)}
    <div class="divider"></div>
    <div class="row">
      <span class="chip">Astuce: tape <span class="kbd">Jn 3:16</span> dans la recherche</span>
    </div>
  `;
  $("btnFav").onclick = ()=>toggleFav(ref,text);
  $("btnShare").onclick = ()=>shareAsImage(ref,text);
}

function renderSearch(){
  $("viewLeft").innerHTML = `
    <h2>Rechercher</h2>
    <div class="field">
      <label>Référence (ex: Jn 3:16)</label>
      <input id="q" placeholder="Jn 3:16" autocomplete="off" />
      <div class="miniHelp">Supporte: <span class="kbd">Jn 3:16</span>, <span class="kbd">Jean 3:16</span>, <span class="kbd">Nombres 26:27</span></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="btnGo">🔎 Chercher</button>
      <button class="btn" id="btnPaste">📋 Coller</button>
    </div>
    <div class="divider"></div>
    <div id="result" class="muted">Entrez une référence…</div>
  `;

  $("viewRight").innerHTML = `
    <h3>Exemples</h3>
    <div class="list">
      ${["Jn 3:16","Psaumes 23:1","Romains 8:28","Proverbes 3:5"].map(x=>`
        <div class="favItem" data-ex="${escapeAttr(x)}">
          <div>
            <div class="r">${escapeHtml(x)}</div>
            <div class="t">Ouvrir directement</div>
          </div>
        </div>
      `).join("")}
    </div>
  `;

  $("btnGo").onclick = async()=>{
    const q = $("q").value.trim();
    const ref = parseRef(q);
    if(!ref){ $("result").textContent="Référence invalide."; return; }
    const p = splitRef(ref);
    const text = await Bible.getVerse(p.book, p.chapter, p.verse);
    if(!text){ $("result").textContent="Introuvable. (Vérifie les fichiers /data)."; return; }

    $("result").innerHTML = verseCard(ref,text);
    $("btnFav").onclick = ()=>toggleFav(ref,text);
    $("btnShare").onclick = ()=>shareAsImage(ref,text);

    state.lastRef = ref; save();
  };

  $("btnPaste").onclick = async()=>{
    try{
      const t = await navigator.clipboard.readText();
      $("q").value = t;
      $("btnGo").click();
    }catch(e){
      toast("Impossible de coller (permissions).", "OK", ()=>{});
    }
  };

  document.querySelectorAll("[data-ex]").forEach(el=>{
    el.onclick = ()=>{
      $("q").value = el.getAttribute("data-ex");
      $("btnGo").click();
    };
  });
}

function renderOpen(){
  const current = parseRef(state.lastRef) || state.lastRef;
  const parts = splitRef(current);

  $("viewLeft").innerHTML = `
    <h2>Ouvrir</h2>

    <div class="field">
      <label>Livre</label>
      <select id="book">
        ${BOOKS.map(([name])=>`<option ${name===parts.book?"selected":""}>${escapeHtml(name)}</option>`).join("")}
      </select>
    </div>

    <div class="field">
      <label>Chapitre</label>
      <input id="chap" type="number" min="1" value="${parts.chapter}" />
    </div>

    <div class="field">
      <label>Verset</label>
      <input id="vers" type="number" min="1" value="${parts.verse}" />
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="btnOpen">📖 Ouvrir</button>
      <button class="btn" id="btnPrev">◀︎</button>
      <button class="btn" id="btnNext">▶︎</button>
    </div>

    <div class="divider"></div>
    <div id="openResult" class="muted">—</div>
  `;

  $("viewRight").innerHTML = `
    <h3>Actions</h3>
    <p class="muted">Sauvegarde automatique du dernier passage.</p>
    <div class="row">
      <button class="btn ${state.poetic?"good":""}" id="btnPoetic">✍️ Style poésie</button>
      <button class="btn warn" id="btnReset">↺ Reset</button>
    </div>
    <div class="divider"></div>
    <p class="muted">Astuce: recherche rapide avec <span class="kbd">Jn 3:16</span>.</p>
  `;

  async function doOpen(){
    const b = $("book").value;
    const c = Math.max(1, parseInt($("chap").value||"1",10));
    const v = Math.max(1, parseInt($("vers").value||"1",10));
    const ref = `${b} ${c}:${v}`;

    const text = await Bible.getVerse(b, c, v);
    if(!text){
      $("openResult").textContent = "Introuvable. Vérifie tes fichiers dans /data (nom du fichier ou structure).";
      state.lastRef = ref; save();
      $("dataStatus").textContent = "Données: partiel";
      return;
    }

    $("openResult").innerHTML = verseCard(ref,text);
    $("btnFav").onclick = ()=>toggleFav(ref,text);
    $("btnShare").onclick = ()=>shareAsImage(ref,text);

    state.lastRef = ref; save();
  }

  $("btnOpen").onclick = doOpen;
  $("btnPrev").onclick = ()=>{ $("vers").value = Math.max(1, parseInt($("vers").value||"1",10)-1); doOpen(); };
  $("btnNext").onclick = ()=>{ $("vers").value = Math.max(1, parseInt($("vers").value||"1",10)+1); doOpen(); };

  $("btnPoetic").onclick = ()=>{ state.poetic = !state.poetic; render(); };
  $("btnReset").onclick = ()=>{
    state.lastRef = "Genèse 1:1";
    state.poetic = false;
    save();
    render();
  };

  doOpen();
}
