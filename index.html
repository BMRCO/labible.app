<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>LaBible.app — Louis Segond 1910</title>
  
  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>

  <!-- Banner Offline -->
  <div id="offline-banner" class="offline-banner">Vous êtes hors ligne. Accès limité aux chapitres mis en cache.</div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-title">LaBible.app</span>
      <span class="brand-version">LSG 1910</span>
    </div>
    <button id="installBtn" class="btn-icon" title="Installer l'app">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
  </header>

  <main class="app-content">
    <!-- Home Dashboard -->
    <section id="home-view" class="view">
      <div class="hero-card">
        <h1>Bonne lecture</h1>
        <p>Explorez les Saintes Écritures partout, même sans connexion.</p>
      </div>

      <div class="resume-card" id="resumeCard">
        <h3>Continuer la lecture</h3>
        <p id="lastReadLabel">Commencez votre voyage biblique.</p>
        <button id="btnContinue" class="btn primary full-width">Ouvrir le chapitre</button>
      </div>

      <div class="grid-nav">
        <div class="nav-card" onclick="showView('reader')">
          <span class="nav-icon">📖</span>
          <span class="nav-label">Lire</span>
        </div>
        <div class="nav-card" onclick="showView('search')">
          <span class="nav-icon">🔍</span>
          <span class="nav-label">Chercher</span>
        </div>
        <div class="nav-card" onclick="showView('favorites')">
          <span class="nav-icon">⭐</span>
          <span class="nav-label">Favoris</span>
        </div>
        <div class="nav-card" onclick="showView('settings')">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Infos</span>
        </div>
      </div>
    </section>

    <!-- Reader View -->
    <section id="reader-view" class="view" style="display:none">
      <div class="reader-controls sticky">
        <select id="bookSelect" class="select-box"></select>
        <select id="chapterSelect" class="select-box"></select>
      </div>
      <div id="verseList" class="verse-list"></div>
      <div class="nav-buttons">
        <button id="prevBtn" class="btn">Précédent</button>
        <button id="nextBtn" class="btn primary">Suivant</button>
      </div>
    </section>
  </main>

  <!-- Navegação Inferior (App Bar) -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active" onclick="showView('home')">
      <span class="icon">🏠</span>
      <span>Accueil</span>
    </a>
    <a href="#" class="nav-item" onclick="showView('reader')">
      <span class="icon">📖</span>
      <span>Bible</span>
    </a>
    <a href="#" class="nav-item" onclick="showView('favorites')">
      <span class="icon">⭐</span>
      <span>Favoris</span>
    </a>
  </nav>

  <script src="/assets/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js");
      });
    }
  </script>
</body>
</html>
