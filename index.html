<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>2026 LaBible.app | LSG 1910</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- iOS icon fallback -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root{
      --bg:#0b0b0b;
      --card:#141414;
      --card2:#101010;
      --text:#fff;
      --muted:rgba(255,255,255,.65);
      --border:#232323;
      --accent:#2c3e50;
      --accent2:#3f5d7a;
      --good:#1f8a4c;
      --warn:#b07a1f;
      --shadow:0 12px 30px rgba(0,0,0,.35);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      padding-bottom:80px;
    }
    a{color:#9fc3ff;text-decoration:none}
    .header{
      position:sticky; top:0; z-index:30;
      background:linear-gradient(to bottom, rgba(11,11,11,.96), rgba(11,11,11,.86));
      backdrop-filter: blur(10px);
      border-bottom:1px solid rgba(255,255,255,.07);
      padding:14px 14px 10px;
    }
    .top{
      display:flex; align-items:center; gap:12px;
    }
    .brand{
      display:flex; flex-direction:column; line-height:1.05;
      min-width:0;
    }
    .brand .t{font-size:20px;font-weight:700;letter-spacing:.2px}
    .brand .s{font-size:13px;color:var(--muted);margin-top:3px}
    .spacer{flex:1}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:9px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.04);
      color:var(--text);
      cursor:pointer;
      white-space:nowrap;
      user-select:none;
    }
    .pill.primary{background:rgba(44,62,80,.75);border-color:rgba(63,93,122,.9)}
    .pill:active{transform:translateY(1px)}
    .bar{
      display:flex; gap:10px;
      margin-top:12px;
      overflow:auto;
      padding-bottom:6px;
      scrollbar-width:none;
    }
    .bar::-webkit-scrollbar{display:none}
    .container{padding:16px;max-width:980px;margin:0 auto}
    .grid{
      display:grid;
      gap:14px;
      grid-template-columns:1fr;
    }
    @media(min-width:900px){
      .grid{grid-template-columns:1.2fr .8fr}
    }
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
    }
    .card h2,.card h3{margin:0 0 10px}
    .muted{color:var(--muted)}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.05);
      color:var(--text);
      cursor:pointer;
      font-size:15px;
      user-select:none;
    }
    .btn.primary{background:rgba(44,62,80,.9);border-color:rgba(63,93,122,1)}
    .btn.good{background:rgba(31,138,76,.22);border-color:rgba(31,138,76,.5)}
    .btn.warn{background:rgba(176,122,31,.18);border-color:rgba(176,122,31,.45)}
    .btn:active{transform:translateY(1px)}
    .field{margin-top:10px}
    label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
    input,select{
      width:100%;
      background:rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.10);
      color:var(--text);
      border-radius:14px;
      padding:12px 12px;
      outline:none;
      font-size:15px;
    }
    input::placeholder{color:rgba(255,255,255,.45)}
    .verseRef{font-weight:700;font-size:16px}
    .verseText{
      font-size:18px;
      line-height:1.55;
      margin-top:10px;
      white-space:pre-wrap;
    }
    .poetic{
      text-align:center;
      font-size:18px;
      line-height:1.75;
      letter-spacing:.2px;
    }
    .chip{
      display:inline-flex; gap:8px; align-items:center;
      padding:7px 10px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      border-radius:999px;
      font-size:13px;
      color:rgba(255,255,255,.8);
    }
    .toast{
      position:fixed;
      left:12px; right:12px; bottom:14px;
      max-width:980px; margin:0 auto;
      background:rgba(15,15,15,.92);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:12px 12px;
      display:none;
      align-items:center;
      gap:10px;
      box-shadow:0 18px 40px rgba(0,0,0,.55);
      z-index:50;
    }
    .toast.show{display:flex}
    .toast .msg{flex:1;color:rgba(255,255,255,.9);font-size:14px}
    .kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:2px 6px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.06)}
    .miniHelp{font-size:13px;color:rgba(255,255,255,.6);margin-top:8px}
    .divider{height:1px;background:rgba(255,255,255,.08);margin:14px 0}
    .list{
      display:flex; flex-direction:column; gap:10px;
      margin-top:12px;
    }
    .favItem{
      display:flex; gap:10px; align-items:flex-start;
      padding:12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      cursor:pointer;
    }
    .favItem:hover{border-color:rgba(159,195,255,.35)}
    .favItem .r{font-weight:700}
    .favItem .t{color:rgba(255,255,255,.75);margin-top:2px;line-height:1.35}
    .badgeOffline{
      display:none;
      margin-left:auto;
      color:rgba(255,255,255,.8);
      border:1px solid rgba(255,255,255,.18);
      background:rgba(176,122,31,.18);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
    }
    .badgeOffline.show{display:inline-flex}
    /* fallback icon circle (if icons missing) */
    .logo{
      width:44px;height:44px;border-radius:14px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
      display:grid;place-items:center;overflow:hidden;
      flex:0 0 auto;
    }
    .logo svg{opacity:.95}
  </style>
</head>
<body>

  <div class="header">
    <div class="top">
      <div class="logo" aria-hidden="true">
        <!-- Inline fallback SVG -->
        <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
          <path d="M10 16c0-3 2-5 5-5h30c5 0 9 4 9 9v30c0 2-2 3-4 2l-6-3-6 3-6-3-6 3-6-3-6 3c-2 1-4 0-4-2V16Z" stroke="rgba(255,255,255,.85)" stroke-width="3"/>
          <path d="M22 22h22M22 30h18M22 38h20" stroke="rgba(255,255,255,.65)" stroke-width="3" stroke-linecap="round"/>
          <path d="M34 8v10" stroke="rgba(159,195,255,.9)" stroke-width="3" stroke-linecap="round"/>
          <path d="M29 13h10" stroke="rgba(159,195,255,.9)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="brand">
        <div class="t">LaBible.app</div>
        <div class="s">LSG 1910 <span class="badgeOffline" id="offlineBadge">Hors ligne</span></div>
      </div>

      <div class="spacer"></div>

      <button class="pill primary" id="installBtn" style="display:none">📲 Installer</button>
    </div>

    <div class="bar">
      <button class="pill" id="tabToday">📅 Lecture du jour</button>
      <button class="pill" id="tabSearch">🔎 Rechercher</button>
      <button class="pill" id="tabOpen">📖 Ouvrir</button>
      <button class="pill" id="tabFav">⭐ Favoris</button>
      <button class="pill" id="tabSettings">⚙️ Réglages</button>
    </div>
  </div>

  <div class="container">
    <div class="grid">
      <div class="card" id="viewLeft"></div>
      <div class="card" id="viewRight"></div>
    </div>
  </div>

  <div class="toast" id="toast">
    <div class="msg" id="toastMsg">…</div>
    <button class="btn primary" id="toastAction" style="display:none">OK</button>
    <button class="btn" id="toastClose">Fermer</button>
  </div>

<script>
/* ============================
   PRO PWA APP (no framework)
   - Install button (Android)
   - iOS hint
   - Offline + update prompt
   - Search "Jn 3:16"
   - Open book/chapter/verse demo dataset
   - Favorites
   - Share as image (canvas)
   - Remember state
============================ */

const $ = (id)=>document.getElementById(id);

const state = {
  tab: localStorage.getItem("tab") || "today",
  poetic: localStorage.getItem("poetic")==="1",
  lastRef: localStorage.getItem("lastRef") || "Genèse 1:1",
  favs: JSON.parse(localStorage.getItem("favs")||"[]"),
  readingDay: parseInt(localStorage.getItem("readingDay")||"1",10),
};

function save(){
  localStorage.setItem("tab", state.tab);
  localStorage.setItem("poetic", state.poetic ? "1":"0");
  localStorage.setItem("lastRef", state.lastRef);
  localStorage.setItem("favs", JSON.stringify(state.favs));
  localStorage.setItem("readingDay", String(state.readingDay));
}

function toast(msg, actionText, actionFn){
  $("toastMsg").textContent = msg;
  if(actionText && actionFn){
    $("toastAction").style.display = "inline-flex";
    $("toastAction").textContent = actionText;
    $("toastAction").onclick = ()=>{ actionFn(); hideToast(); };
  }else{
    $("toastAction").style.display = "none";
    $("toastAction").onclick = null;
  }
  $("toast").classList.add("show");
}
function hideToast(){ $("toast").classList.remove("show"); }
$("toastClose").onclick = hideToast;

/* ============================
   Minimal demo "Bible" data
   -> Troca depois para teus JSON reais
============================ */
const BOOKS = [
  { key:"GEN", name:"Genèse", abbr:["gen","ge","gn"] },
  { key:"EXO", name:"Exode", abbr:["exo","ex"] },
  { key:"JHN", name:"Jean", abbr:["jn","jean","john","j"] },
  { key:"NUM", name:"Nombres", abbr:["nb","nom","nombres","nm"] },
];

const DEMO = {
  "Genèse 1:1": "Au commencement, Dieu créa les cieux et la terre.",
  "Jean 3:16": "Car Dieu a tant aimé le monde qu'il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu'il ait la vie éternelle.",
  "Nombres 26:27": "Ce sont là les familles des Zabulonites, d'après leur dénombrement: soixante mille cinq cents."
};

// Lecture du jour (demo) — podes ligar ao teu JSON do plano
function getVerseOfDay(){
  // usa dia do ano para estabilidade
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const diff = now - start;
  const oneDay = 1000*60*60*24;
  const day = Math.floor(diff/oneDay);

  const refs = Object.keys(DEMO);
  return refs[day % refs.length];
}

function render(){
  save();
  // highlight tab (simple)
  ["tabToday","tabSearch","tabOpen","tabFav","tabSettings"].forEach(id=>{
    $(id).classList.remove("primary");
  });
  const map = {today:"tabToday",search:"tabSearch",open:"tabOpen",fav:"tabFav",settings:"tabSettings"};
  $(map[state.tab]).classList.add("primary");

  if(state.tab==="today") renderToday();
  if(state.tab==="search") renderSearch();
  if(state.tab==="open") renderOpen();
  if(state.tab==="fav") renderFav();
  if(state.tab==="settings") renderSettings();
}

function verseCard(ref, text){
  const isFav = state.favs.some(f=>f.ref===ref);
  return `
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <div class="verseRef">${escapeHtml(ref)}</div>
        <div class="verseText ${state.poetic ? "poetic":""}">${escapeHtml(text)}</div>
      </div>
      <div class="row">
        <button class="btn ${isFav?"good":""}" id="btnFav">${isFav?"★":"☆"} Favori</button>
        <button class="btn primary" id="btnShare">📤 Partager</button>
      </div>
    </div>
  `;
}

function renderToday(){
  const ref = getVerseOfDay();
  const text = DEMO[ref] || "…";
  $("viewLeft").innerHTML = `
    <h2>Verset du jour</h2>
    ${verseCard(ref,text)}
    <div class="divider"></div>
    <div class="row">
      <span class="chip">Astuce: tape <span class="kbd">Jn 3:16</span> dans la recherche</span>
      <button class="btn" id="btn365">Voir les 365 jours</button>
    </div>
  `;
  $("viewRight").innerHTML = `
    <h3>Continuer</h3>
    <p class="muted">Reprendre là où vous étiez.</p>
    <button class="btn primary" id="btnContinue">▶️ Continuer</button>
    <div class="miniHelp">Dernier passage: <span class="kbd">${escapeHtml(state.lastRef)}</span></div>
  `;

  $("btnFav").onclick = ()=>toggleFav(ref,text);
  $("btnShare").onclick = ()=>shareAsImage(ref,text);
  $("btnContinue").onclick = ()=>{ openRef(state.lastRef); state.tab="open"; render(); };
  $("btn365").onclick = ()=>{
    toast("Plan de lecture: connecte ton JSON 365 ici (je te plug ça no próximo passo).", "OK", ()=>{});
  };
}

function renderSearch(){
  $("viewLeft").innerHTML = `
    <h2>Rechercher</h2>
    <div class="field">
      <label>Référence (ex: Jn 3:16)</label>
      <input id="q" placeholder="Jn 3:16" autocomplete="off" />
      <div class="miniHelp">Supporte: <span class="kbd">Jn 3:16</span>, <span class="kbd">Jean 3:16</span>, <span class="kbd">Nombres 26:27</span></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="btnGo">🔎 Chercher</button>
      <button class="btn" id="btnPaste">📋 Coller</button>
    </div>
    <div class="divider"></div>
    <div id="result" class="muted">Entrez une référence…</div>
  `;
  $("viewRight").innerHTML = `
    <h3>Exemples</h3>
    <div class="list">
      ${["Jn 3:16","Nombres 26:27","Genèse 1:1"].map(x=>`
        <div class="favItem" data-ex="${x}">
          <div>
            <div class="r">${escapeHtml(x)}</div>
            <div class="t">Ouvrir directement</div>
          </div>
        </div>
      `).join("")}
    </div>
  `;

  $("btnGo").onclick = ()=>{
    const q = $("q").value.trim();
    const ref = parseRef(q);
    if(!ref){ $("result").textContent="Référence invalide."; return; }
    const text = DEMO[ref] || null;
    if(!text){ $("result").textContent="Introuvable (demo). Branche tes JSON Bible ici."; return; }
    $("result").innerHTML = verseCard(ref,text);
    $("btnFav").onclick = ()=>toggleFav(ref,text);
    $("btnShare").onclick = ()=>shareAsImage(ref,text);
    state.lastRef = ref; save();
  };

  $("btnPaste").onclick = async()=>{
    try{
      const t = await navigator.clipboard.readText();
      $("q").value = t;
      $("btnGo").click();
    }catch(e){
      toast("Impossible de coller (permissions).", "OK", ()=>{});
    }
  };

  document.querySelectorAll("[data-ex]").forEach(el=>{
    el.onclick = ()=>{
      $("q").value = el.getAttribute("data-ex");
      $("btnGo").click();
    };
  });
}

function renderOpen(){
  const current = parseRef(state.lastRef) || "Genèse 1:1";
  const parts = splitRef(current);
  const bookName = parts.book;
  const chap = parts.chapter;
  const verse = parts.verse;

  $("viewLeft").innerHTML = `
    <h2>Ouvrir</h2>

    <div class="field">
      <label>Livre</label>
      <select id="book">
        ${BOOKS.map(b=>`<option ${b.name===bookName?"selected":""}>${escapeHtml(b.name)}</option>`).join("")}
      </select>
    </div>

    <div class="field">
      <label>Chapitre</label>
      <input id="chap" type="number" min="1" value="${chap}" />
    </div>

    <div class="field">
      <label>Verset</label>
      <input id="vers" type="number" min="1" value="${verse}" />
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="btnOpen">📖 Ouvrir</button>
      <button class="btn" id="btnPrev">◀︎</button>
      <button class="btn" id="btnNext">▶︎</button>
    </div>

    <div class="divider"></div>
    <div id="openResult" class="muted">—</div>
  `;

  $("viewRight").innerHTML = `
    <h3>Actions</h3>
    <p class="muted">Sauvegarde automatique du dernier passage.</p>
    <div class="row">
      <button class="btn ${state.poetic?"good":""}" id="btnPoetic">✍️ Style poésie</button>
      <button class="btn warn" id="btnReset">↺ Reset</button>
    </div>
    <div class="divider"></div>
    <p class="muted">Astuce: recherche rapide avec <span class="kbd">Jn 3:16</span>.</p>
  `;

  function doOpen(){
    const b = $("book").value;
    const c = Math.max(1, parseInt($("chap").value||"1",10));
    const v = Math.max(1, parseInt($("vers").value||"1",10));
    const ref = `${b} ${c}:${v}`;
    const text = DEMO[ref] || null;

    if(!text){
      $("openResult").textContent = "Introuvable (demo). Branche tes JSON Bible ici.";
      state.lastRef = ref; save();
      return;
    }
    $("openResult").innerHTML = verseCard(ref,text);
    $("btnFav").onclick = ()=>toggleFav(ref,text);
    $("btnShare").onclick = ()=>shareAsImage(ref,text);
    state.lastRef = ref; save();
  }

  $("btnOpen").onclick = doOpen;
  $("btnPrev").onclick = ()=>{ $("vers").value = Math.max(1, parseInt($("vers").value||"1",10)-1); doOpen(); };
  $("btnNext").onclick = ()=>{ $("vers").value = Math.max(1, parseInt($("vers").value||"1",10)+1); doOpen(); };

  $("btnPoetic").onclick = ()=>{ state.poetic = !state.poetic; render(); };
  $("btnReset").onclick = ()=>{
    state.lastRef = "Genèse 1:1";
    state.poetic = false;
    save();
    render();
  };

  doOpen();
}

function renderFav(){
  $("viewLeft").innerHTML = `
    <h2>Favoris</h2>
    <p class="muted">${state.favs.length ? "Vos versets enregistrés." : "Aucun favori pour le moment."}</p>
    <div class="list" id="favList"></div>
  `;
  $("viewRight").innerHTML = `
    <h3>Astuce</h3>
    <p class="muted">Ajoute un favori depuis un verset, puis retrouve-le ici.</p>
    <div class="divider"></div>
    <button class="btn warn" id="btnClearFav" ${state.favs.length?"":"disabled"}>🗑️ Vider</button>
  `;

  const list = $("favList");
  if(state.favs.length){
    list.innerHTML = state.favs.map(f=>`
      <div class="favItem" data-ref="${escapeAttr(f.ref)}">
        <div style="flex:1">
          <div class="r">${escapeHtml(f.ref)}</div>
          <div class="t">${escapeHtml(f.text)}</div>
        </div>
      </div>
    `).join("");
    document.querySelectorAll("[data-ref]").forEach(el=>{
      el.onclick = ()=>{
        const ref = el.getAttribute("data-ref");
        state.lastRef = ref;
        state.tab = "open";
        render();
      };
    });
  }

  $("btnClearFav").onclick = ()=>{
    state.favs = [];
    save();
    render();
  };
}

function renderSettings(){
  $("viewLeft").innerHTML = `
    <h2>Réglages</h2>
    <div class="row" style="margin-top:8px">
      <span class="chip">Version PWA PRO</span>
      <span class="chip">Offline</span>
      <span class="chip">Update auto</span>
    </div>
    <div class="divider"></div>
    <p class="muted">Installation:</p>
    <ul class="muted" style="line-height:1.6;margin-top:6px">
      <li><b>Android/Chrome</b>: bouton <span class="kbd">Installer</span> en haut si disponible.</li>
      <li><b>iPhone/Safari</b>: Partager → <b>Ajouter à l’écran d’accueil</b>.</li>
    </ul>
  `;
  $("viewRight").innerHTML = `
    <h3>Maintenance</h3>
    <p class="muted">Forcer la mise à jour du cache si nécessaire.</p>
    <div class="row">
      <button class="btn primary" id="btnUpdate">🔄 Vérifier update</button>
      <button class="btn warn" id="btnUnregister">🧹 Reset PWA</button>
    </div>
  `;

  $("btnUpdate").onclick = async()=>{
    if(navigator.serviceWorker?.controller){
      navigator.serviceWorker.controller.postMessage({type:"CHECK_UPDATE"});
      toast("Demande de mise à jour envoyée.", "OK", ()=>{});
    }else{
      toast("Service Worker non actif.", "OK", ()=>{});
    }
  };

  $("btnUnregister").onclick = async()=>{
    if(!("serviceWorker" in navigator)){ toast("SW non supporté.", "OK", ()=>{}); return; }
    const regs = await navigator.serviceWorker.getRegistrations();
    for(const r of regs) await r.unregister();
    toast("PWA reset. Recharge la page.", "Recharger", ()=>location.reload());
  };
}

/* ============================
   Favorites
============================ */
function toggleFav(ref, text){
  const i = state.favs.findIndex(f=>f.ref===ref);
  if(i>=0){
    state.favs.splice(i,1);
    toast("Retiré des favoris.", "OK", ()=>{});
  }else{
    state.favs.unshift({ref, text});
    state.favs = state.favs.slice(0, 200);
    toast("Ajouté aux favoris.", "Voir", ()=>{ state.tab="fav"; render(); });
  }
  save();
  render();
}

/* ============================
   Share as Image (Canvas)
============================ */
async function shareAsImage(ref, text){
  try{
    const blob = await makeShareImage(ref, text);
    const file = new File([blob], "labible.png", {type:"image/png"});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({
        title: "LaBible.app",
        text: `${ref} — LSG 1910`,
        files:[file]
      });
      return;
    }

    // fallback: download
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "labible.png";
    a.click();
    URL.revokeObjectURL(url);

    toast("Image téléchargée (fallback).", "OK", ()=>{});
  }catch(e){
    toast("Partage indisponible sur cet appareil.", "OK", ()=>{});
  }
}

function roundRect(ctx, x,y,w,h,r){
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr, y);
  ctx.arcTo(x+w, y, x+w, y+h, rr);
  ctx.arcTo(x+w, y+h, x, y+h, rr);
  ctx.arcTo(x, y+h, x, y, rr);
  ctx.arcTo(x, y, x+w, y, rr);
  ctx.closePath();
}

async function makeShareImage(ref, text){
  const W = 1080, H = 1350; // IG portrait
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  // background
  ctx.fillStyle = "#0b0b0b";
  ctx.fillRect(0,0,W,H);

  // card
  const pad = 80;
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.strokeStyle = "rgba(255,255,255,0.14)";
  ctx.lineWidth = 3;
  roundRect(ctx, pad, pad, W-pad*2, H-pad*2, 48);
  ctx.fill(); ctx.stroke();

  // header
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.font = "700 44px system-ui, -apple-system, Segoe UI, Roboto, Arial";
  ctx.fillText("LaBible.app", pad+56, pad+90);

  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.font = "500 28px system-ui, -apple-system, Segoe UI, Roboto, Arial";
  ctx.fillText("LSG 1910", pad+56, pad+132);

  // ref
  ctx.fillStyle = "rgba(159,195,255,0.95)";
  ctx.font = "700 40px system-ui, -apple-system, Segoe UI, Roboto, Arial";
  ctx.fillText(ref, pad+56, pad+210);

  // text wrap
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.font = "500 40px system-ui, -apple-system, Segoe UI, Roboto, Arial";

  const maxW = W - (pad+56)*2;
  const lines = wrapText(ctx, text, maxW);
  let y = pad+290;
  for(const line of lines.slice(0, 18)){
    ctx.fillText(line, pad+56, y);
    y += 56;
  }

  // footer
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.font = "500 28px system-ui, -apple-system, Segoe UI, Roboto, Arial";
  ctx.fillText("#LaBible #LSG1910 #versetdujour", pad+56, H - pad - 80);

  return await new Promise((res)=>canvas.toBlob(res, "image/png", 0.95));
}

function wrapText(ctx, text, maxWidth){
  const words = text.split(/\s+/);
  const lines = [];
  let line = "";
  for(const w of words){
    const test = line ? line + " " + w : w;
    if(ctx.measureText(test).width <= maxWidth){
      line = test;
    }else{
      if(line) lines.push(line);
      line = w;
    }
  }
  if(line) lines.push(line);
  return lines;
}

/* ============================
   Parse ref "Jn 3:16"
============================ */
function parseRef(q){
  if(!q) return null;
  const raw = q.trim().replace(/\s+/g," ");
  // formats: "Jn 3:16" / "Jean 3:16" / "Nombres 26:27"
  const m = raw.match(/^(.+?)\s+(\d+)\s*[:.]\s*(\d+)$/i);
  if(!m) return null;
  const bookIn = m[1].toLowerCase().trim();
  const c = parseInt(m[2],10);
  const v = parseInt(m[3],10);

  const book = BOOKS.find(b=>{
    if(b.name.toLowerCase()===bookIn) return true;
    return b.abbr.includes(bookIn);
  });

  if(!book) return null;
  return `${book.name} ${c}:${v}`;
}

function splitRef(ref){
  const m = ref.match(/^(.+?)\s+(\d+)\s*:\s*(\d+)$/);
  if(!m) return {book:"Genèse",chapter:1,verse:1};
  return {book:m[1],chapter:parseInt(m[2],10),verse:parseInt(m[3],10)};
}
function openRef(ref){
  state.lastRef = parseRef(ref) || ref;
  save();
}

/* ============================
   Safe html
============================ */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

/* ============================
   PWA INSTALL (Android/Chrome)
============================ */
let deferredPrompt;
const installBtn = $("installBtn");
installBtn.style.display = "none";

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "inline-flex";
});

installBtn.addEventListener("click", async ()=>{
  if(!deferredPrompt){
    toast("Installation non disponible ici. Sur iPhone: Partager → Ajouter à l’écran d’accueil.", "OK", ()=>{});
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if(outcome === "accepted"){
    installBtn.textContent = "✔️ Installé";
    toast("Application installée.", "OK", ()=>{});
  }
  deferredPrompt = null;
});

/* ============================
   SERVICE WORKER + Update flow
============================ */
async function registerSW(){
  if(!("serviceWorker" in navigator)) return;

  try{
    const reg = await navigator.serviceWorker.register("sw.js");

    // new version found
    reg.addEventListener("updatefound", ()=>{
      const sw = reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange", ()=>{
        if(sw.state === "installed"){
          if(navigator.serviceWorker.controller){
            toast("Mise à jour disponible.", "Recharger", ()=>location.reload());
          }else{
            toast("PWA prête (offline activé).", "OK", ()=>{});
          }
        }
      });
    });

    // allow page to receive SW messages
    navigator.serviceWorker.addEventListener("message", (ev)=>{
      if(ev.data?.type==="FORCE_RELOAD"){
        location.reload();
      }
    });

  }catch(e){
    // ignore
  }
}

registerSW();
updateOnlineUI();
render();
