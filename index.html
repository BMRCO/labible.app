  <script>
  (function () {
    var input   = document.getElementById('globalSearchInput');
    var btn     = document.getElementById('globalSearchBtn');
    var clearBtn= document.getElementById('globalSearchClear');
    var resultsBox = document.getElementById('globalResults');
    var resultsMeta= document.getElementById('gResultsMeta');
    var resultsList= document.getElementById('gResultsList');

    function showClear(val) { clearBtn.style.display = val ? 'flex' : 'none'; }
    input.addEventListener('input', function () { showClear(input.value); if (!input.value) closeResults(); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
    clearBtn.addEventListener('click', function () { input.value = ''; showClear(false); closeResults(); input.focus(); });
    btn.addEventListener('click', doSearch);

    function closeResults() { resultsBox.classList.remove('active'); resultsList.innerHTML = ''; }

    function doSearch() {
      var q = input.value.trim();
      if (!q) return;
      if (typeof window.appSearch !== 'function') return;
      var hits = window.appSearch(q);
      if (hits === null) {
        resultsMeta.textContent = '⏳ Chargement… réessaie dans un instant.';
        resultsBox.classList.add('active');
        resultsList.innerHTML = '';
        setTimeout(function () { doSearch(); }, 1500);
        return;
      }
      renderResults(q, hits);
    }

    var PAGE = 50;

    function makeResultItem(hit) {
      var el = document.createElement('div');
      el.className = 'gResultItem';
      var bodyHtml = hit.textHtml ? '« ' + hit.textHtml + ' »' : '« ' + hit.text + ' »';
      el.innerHTML =
        '<div class="gResultHead"><span class="gResultRef">' + hit.ref + '</span><span class="gResultArrow">›</span></div>' +
        '<div class="gResultBody"><div class="gResultText" style="cursor:pointer">' + bodyHtml + '</div><div class="gResultActions"><button class="btnCopy">📎 Copier</button></div></div>';
      el.querySelector('.gResultHead').addEventListener('click', function () { el.classList.toggle('open'); });
      el.querySelector('.gResultText').addEventListener('click', function (e) {
        e.stopPropagation();
        if (typeof window.appGoTo === 'function') { window.appGoTo(hit.ref); closeResults(); input.value = ''; showClear(false); }
      });
      el.querySelector('.btnCopy').addEventListener('click', function (e) {
        e.stopPropagation();
        navigator.clipboard && navigator.clipboard.writeText('« ' + hit.text + ' »\n— ' + hit.ref + ' (LSG 1910)\n📖 https://labible.app');
      });
      return el;
    }

    function renderResults(q, hits) {
      resultsList.innerHTML = '';
      if (!hits.length) { resultsMeta.textContent = 'Aucun résultat pour « ' + q + ' »'; resultsBox.classList.add('active'); return; }
      resultsMeta.textContent = '✦ ' + hits.length + ' résultat' + (hits.length > 1 ? 's' : '') + ' — « ' + q.toUpperCase() + ' »';

      var shown = 0;
      var moreBtn = document.createElement('button');
      moreBtn.id = 'gMoreBtn';

      function renderMore() {
        if (moreBtn.parentNode) moreBtn.parentNode.removeChild(moreBtn);
        var slice = hits.slice(shown, shown + PAGE);
        for (var i = 0; i < slice.length; i++) { resultsList.appendChild(makeResultItem(slice[i])); }
        shown += slice.length;
        if (shown < hits.length) {
          moreBtn.textContent = 'Afficher plus (' + (hits.length - shown) + ' restants)';
          resultsList.appendChild(moreBtn);
        }
      }

      moreBtn.addEventListener('click', renderMore);
      renderMore();
      resultsBox.classList.add('active');
    }
  })();
  </script>

  <script>
    /* Navigation depuis les pages de contenu (barre partagée) : /#plan /#bibliotheque /#q=motclé
       On capture le hash TOUT DE SUITE (avant que l'app ne le remplace par #Livre-Chapitre). */
    (function () {
      var captured = '';
      try { captured = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim(); } catch (e) {}

      function act(h, tries) {
        tries = tries || 0;
        if (!h) return;
        if (h === 'plan' || h === 'bibliotheque' || h === 'library') {
          if (typeof setView === 'function') {
            setView(h === 'plan' ? 'plan' : 'library');
          } else if (tries < 40) {
            setTimeout(function () { act(h, tries + 1); }, 200);
          }
          return;
        }
        if (h.indexOf('q=') === 0) {
          var q = h.slice(2).trim();
          var input = document.getElementById('globalSearchInput');
          var btn = document.getElementById('globalSearchBtn');
          if (q && input && btn) {
            if (typeof window.appSearch === 'function') {
              input.value = q;
              btn.click();
            } else if (tries < 40) {
              setTimeout(function () { act(h, tries + 1); }, 200);
            }
          }
        }
      }

      // au chargement : agir sur le hash capté (plan/biblio après un court délai pour laisser l'app démarrer)
      window.addEventListener('load', function () {
        if (captured.indexOf('q=') === 0) { setTimeout(function () { act(captured, 0); }, 120); }
        else if (captured) { setTimeout(function () { act(captured, 0); }, 400); }
      });
      // navigation ultérieure (clic sur un onglet) : utiliser le hash courant
      window.addEventListener('hashchange', function () {
        var h = '';
        try { h = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim(); } catch (e) {}
        act(h, 0);
      });
    })();
  </script>

</body>
</html>
