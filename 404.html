<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LaBible.app</title>
</head>
<body>
<script>
  // GitHub Pages SPA deep-link fix:
  // Store the attempted path and redirect to / (index.html) where app.js will restore it.
  sessionStorage.setItem("labible:redirect", location.pathname + location.search + location.hash);
  location.replace("/");
</script>
</body>
</html>
